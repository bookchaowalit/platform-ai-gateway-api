name: Shared admission
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-admission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AI_GATEWAY_TEST_DATA_PYTHON: python3
      AI_GATEWAY_TEST_PG_DSN: dbname=postgres user=postgres host=127.0.0.1 port=5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install reviewed data and core fixtures
        run: |
          python -m pip install 'platform-backend-core @ git+https://github.com/bookchaowalit-backend/platform-backend-core.git@d00e0119c2e47da3942d9c7b4b88828953f8bc5a'
          python -m pip install 'platform-data @ git+https://github.com/bookchaowalit-backend/platform-data.git@2441e9e4175a28c9a67e1ed2eeec2cd897a79a99'
      - run: npm ci
      - run: npm test
      - run: npm run build
