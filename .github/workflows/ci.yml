# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      node-version: "22" # matches the node:22-slim image
      # No Biome/ESLint config yet: lint is skipped with a warning (follow-up).
      # Typecheck: tsconfig.json (strict) over api/, mcp/ and tests/. sentry.ts imports @sentry/node,
      # which only the service's own lockfile installs, so install it first (as the build does).
      typecheck-command: npm --prefix api/ai-gateway-service ci --no-audit --no-fund && npm run typecheck
      # Tests: `npm test` (tsx --test tests/*.ts); fail if the test script ever disappears.
      require-tests: true
      # No coverage gate: node:test under tsx writes no coverage/coverage-summary.json (needs
      # vitest/jest or a custom reporter; follow-up).
      # The build installs api/ai-gateway-service from its own lockfile and bundles it with esbuild,
      # the same steps as the Dockerfile.
      build-command: npm run build

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
